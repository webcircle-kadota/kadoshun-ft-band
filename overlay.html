    --ink: #08080b;
    --glass: rgba(10, 10, 14, .84);
    --glass-2: rgba(20, 18, 24, .92);
    --gold-hi: #fff4cf;
    --gold: #e7c36a;
    --gold-mid: #c99a34;
    --gold-lo: #8a6418;
    --red: #e0213f;
    --white: #f7f4ee;
    --muted: #b9b2a3;
    --gold-grad: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 38%, var(--gold-mid) 70%, var(--gold-lo) 100%);
    --gold-grad-x: linear-gradient(90deg, var(--gold-lo) 0%, var(--gold) 30%, var(--gold-hi) 50%, var(--gold) 70%, var(--gold-lo) 100%);
    --ease-in: cubic-bezier(.2,.9,.25,1.12);
    --ease-out: cubic-bezier(.6,0,.8,.3);
  }
  html, body {
    margin: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  body.preview { background: radial-gradient(ellipse 60% 45% at 50% 52%, #1d6b3e 0%, #0f4227 55%, #071a10 100%); }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    font-family: "Noto Sans JP", "Meiryo", sans-serif;
    color: var(--white);
  }
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .en { font-family: "Oswald", "Arial Narrow", sans-serif; }
  .goldtxt {
    background: var(--gold-grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  em { font-style: normal; }
  .msg em {
    background: var(--gold-grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none;
  }

  /* 光が横切る */
  .sweep { position: relative; overflow: hidden; }
  .sweep::after {
    content: "";
    position: absolute; top: 0; bottom: 0;
    width: 170px; left: -250px;
    background: linear-gradient(100deg, transparent, rgba(255,240,200,.27), transparent);
    transform: skewX(-20deg);
    animation: sweep 8s ease-in-out infinite;
    animation-delay: var(--sweep-delay, 3s);
    pointer-events: none;
  }
  @keyframes sweep { 0% { left: -250px; } 16% { left: 110%; } 100% { left: 110%; } }
  @keyframes slide-grad { to { background-position: -200% 0; } }

  /* コイン（共通。大きさは各レイアウトで指定） */
  .emblem { position: relative; flex: none; perspective: 600px; }
  .coin {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: coin-flip 14s cubic-bezier(.6,0,.3,1) 3.5s infinite;
  }
  .coin .face {
    position: absolute; inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #2a2730 0%, #121116 60%, #060608 100%);
  }
  .coin .back { transform: rotateY(180deg); }
  .logo-mask {
    background: var(--gold-grad);
    -webkit-mask: var(--face) center / contain no-repeat;
            mask: var(--face) center / contain no-repeat;
  }
  .coin .suit {
    line-height: 1;
    background: var(--gold-grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes coin-flip {
    0%, 82%  { transform: rotateY(0deg); }
    88%, 94% { transform: rotateY(180deg); }
    100%     { transform: rotateY(360deg); }
  }

  /* メッセージ（共通） */
  .msgbox { position: relative; overflow: hidden; }
  .msg {
    position: absolute; top: 50%;
    font-weight: 900; white-space: nowrap;
  }
  .msg.in  { animation: msg-in .65s cubic-bezier(.2,.9,.3,1) both; }
  .msg.out { animation: msg-out .45s cubic-bezier(.6,0,.8,.4) both; }
  @keyframes msg-in {
    from { opacity: 0; transform: translate(var(--tx, 0), 30%) scaleX(var(--sx,1)); filter: blur(5px); }
    to   { opacity: 1; transform: translate(var(--tx, 0), -50%) scaleX(var(--sx,1)); filter: blur(0); }
  }
  @keyframes msg-out {
    from { opacity: 1; transform: translate(var(--tx, 0), -50%) scaleX(var(--sx,1)); }
    to   { opacity: 0; transform: translate(var(--tx, 0), -135%) scaleX(var(--sx,1)); }
  }
  .progress { position: absolute; height: 3px; background: rgba(255,255,255,.07); }
  .progress i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--gold-grad-x); }

  /* スポンサー名（共通） */
  .name-wrap { position: relative; min-width: 0; }
  .name {
    position: absolute; left: 0; top: 50%;
    font-weight: 900; white-space: nowrap;
    transform-origin: 0 50%;
  }
  .name small { font-weight: 700; margin-left: 6px; -webkit-text-fill-color: var(--muted); }
  .name.in  { animation: sp-in .55s cubic-bezier(.2,.9,.3,1) both; }
  .name.out { animation: sp-out .35s ease-in both; }
  @keyframes sp-in  { from { opacity: 0; transform: translate(34px, -50%) scaleX(var(--sx,1)); } to { opacity: 1; transform: translate(0, -50%) scaleX(var(--sx,1)); } }
  @keyframes sp-out { from { opacity: 1; transform: translate(0, -50%) scaleX(var(--sx,1)); } to { opacity: 0; transform: translate(-34px, -50%) scaleX(var(--sx,1)); } }

  /* ===== レイアウト切替：表示中のレイアウトだけ画面内に入る ===== */
  .part { transition: transform .75s var(--ease-out), clip-path .75s var(--ease-out); }
  body.L-full    #full .part,
  body.L-compact #compact .part { transition: transform .9s var(--ease-in) var(--d, 0s), clip-path .9s var(--ease-in) var(--d, 0s); }
  body.no-anim .part { transition: none !important; }
  body.no-anim .sb-slide, body.no-anim #standby, body.no-anim .sb-dots span { transition: none !important; }

    font-family: "Noto Sans JP", sans-serif; font-size: 30px; font-weight: 900; letter-spacing: .12em;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .suits span { display: inline-block; margin-left: 6px; color: #3a3640; animation: suit-glow 4s ease-in-out infinite; }

  #f-lower {
    position: absolute; left: 0; right: 0; bottom: 40px; height: 104px;

  #f-state {
    position: relative; flex: none; width: 300px;

  }
  #f-state .label { font-size: 50px; font-weight: 700; letter-spacing: .1em; line-height: 1; }
  #f-msgbox {
    flex: 1;
    margin-left: -34px; padding-left: 76px;

    clip-path: polygon(34px 0, 100% 0, calc(100% - 34px) 100%, 0 100%);

  }
  #f-msgbox .rule-t, #f-msgbox .rule-b {
    position: absolute; left: 0; right: 0; height: 2px;
    background: var(--gold-grad-x); background-size: 200% 100%;
    animation: slide-grad 5s linear infinite;
  }
  #f-msgbox .rule-t { top: 0; opacity: .9; }
  #f-msgbox .rule-b { bottom: 0; opacity: .5; animation-direction: reverse; }
  #f-msgbox .msg {
    left: 76px;

  #f-sponsor .name-wrap { height: 46px; margin-top: 6px; }
  #f-sponsor .name { font-size: 32px; }
  #f-sponsor .name small { font-size: 20px; }
  #f-lower .progress { left: 266px; right: 0; bottom: -8px; }

  /* ================================================================
     コンパクト帯（対戦中 / 優勝決定）：ハンドOLの空き場所だけ
     ================================================================ */
  #c-crest {
    position: absolute; left: 580px; top: 0; width: 760px;

  }

  }

  }

  /* ================================================================
     待機画面（配信開始前）：画面全体を覆う。透過しない
     ================================================================ */
  #standby {
    position: absolute; inset: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 62%, rgba(24,96,56,.42) 0%, rgba(10,40,24,.25) 45%, transparent 75%),
      radial-gradient(ellipse 60% 40% at 50% -5%, rgba(231,195,106,.18), transparent 70%),
      #07070a;
    opacity: 0; visibility: hidden;
    transition: opacity .9s ease, visibility 0s linear .9s;
  }
  body.L-standby #standby { opacity: 1; visibility: visible; transition: opacity .9s ease; }
  .sb-beam {
    position: absolute; width: 1400px; height: 1400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(231,195,106,.10), transparent 60%);
    filter: blur(20px);
    animation: beam 26s ease-in-out infinite alternate;
  }
  .sb-beam.b2 { background: radial-gradient(circle, rgba(40,150,90,.12), transparent 60%); animation-duration: 32s; animation-delay: -12s; }
  @keyframes beam {
    0%   { transform: translate(-500px, -300px); }
    50%  { transform: translate(900px, 100px); }
    100% { transform: translate(200px, -500px); }
  }
  /* 大きなスート：漂いながら回り、ときどき金色にほのかに光る */
  .sb-suit {
    position: absolute; font-size: 420px; line-height: 1;
    color: rgba(231,195,106,.045);
    animation:
      drift var(--dur, 22s) ease-in-out infinite alternate,
      glint 9s ease-in-out infinite;
    animation-delay: var(--delay, 0s), var(--gdelay, 0s);
  }
  .sb-suit.r { color: rgba(224,33,63,.045); }
  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(-10deg) scale(1); }
    50%  { transform: translate(var(--dx, 60px), calc(var(--dy, -70px) * .5)) rotate(4deg) scale(1.06); }
    100% { transform: translate(calc(var(--dx, 60px) * -.4), var(--dy, -70px)) rotate(12deg) scale(.96); }
  }
  @keyframes glint {
    0%, 70%, 100% { text-shadow: none; }
    82%           { text-shadow: 0 0 40px rgba(231,195,106,.35), 0 0 120px rgba(231,195,106,.18); }
  }
  /* 小さなスート：下から上へゆっくり舞い上がる */
  .sb-float {
    position: absolute; bottom: -120px; line-height: 1;
    color: rgba(231,195,106,.10);
    animation: rise var(--dur, 26s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  .sb-float.r { color: rgba(224,33,63,.10); }
  @keyframes rise {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(var(--sway, 40px), -620px) rotate(180deg); }
    90%  { opacity: 1; }
    100% { transform: translate(calc(var(--sway, 40px) * -.5), -1260px) rotate(360deg); opacity: 0; }
  }

  .sb-head .tag {
    font-family: "Oswald", sans-serif; font-size: 22px; font-weight: 700; letter-spacing: .12em;
    color: var(--ink); background: var(--gold-grad); padding: 3px 12px 2px;

  .sb-center { position: absolute; left: 0; right: 0; top: 240px; text-align: center; }
  .sb-soon { font-size: 30px; letter-spacing: .5em; color: var(--gold); padding-left: .5em; }
  .sb-title { margin-top: 6px; font-size: 86px; font-weight: 900; letter-spacing: .08em; line-height: 1.1; text-shadow: 0 6px 30px rgba(0,0,0,.6); }

    display: inline-flex; align-items: center; gap: 14px;
    margin-top: 14px; padding: 6px 22px 6px 6px;

  .sb-prize .k { font-size: 18px; font-weight: 700; letter-spacing: .2em; color: var(--ink); background: var(--gold-grad); padding: 4px 12px 3px; }

  .sb-prize .v small { font-size: 20px; margin-left: 4px; }

  /* ファイナリスト：1人ずつフェードで入れ替わる */
  .sb-players { position: absolute; left: 70px; right: 70px; top: 716px; }
  .sb-players .cap { display: flex; align-items: center; gap: 18px; font-size: 22px; letter-spacing: .3em; color: var(--gold); margin-bottom: 14px; }
  .sb-players .cap::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(231,195,106,.6), transparent); }

  .sb-rank { width: 220px; text-align: center; flex: none; }
  .sb-rank .l { font-size: 22px; letter-spacing: .4em; color: var(--muted); padding-left: .4em; }
  .sb-rank .n { display: inline-block; font-size: 128px; font-weight: 700; line-height: 1; }
  .sb-div { width: 2px; height: 140px; flex: none; background: linear-gradient(180deg, transparent, var(--gold-mid), transparent); }
  .sb-pinfo { width: 900px; min-width: 0; }
  .sb-pinfo .rv { display: inline-block; font-size: 16px; font-weight: 900; letter-spacing: .1em; color: #fff; background: var(--red); padding: 2px 10px; margin-bottom: 6px; }
  .sb-pinfo .nm { font-size: 66px; font-weight: 900; line-height: 1.1; letter-spacing: .04em; white-space: nowrap; }

<script>
// ================= ここを書き換えれば文言を変えられる =================
// <em>…</em> は金色。{name} は優勝者名に置き換わる
// 全幅帯のメッセージは長め（約1000px）、コンパクト帯は短め（約630px）に。長い文は自動で横に詰める
const CONFIG = {
  holdMs: 9000,
  sponsorMs: 4000,
  // 待機画面（配信開始前）
  standby: {
    start: "2026-10-10T14:30:00+09:00",   // 配信開始（YouTube の予約時刻）

      { rank: 3, name: "宮嶋先生",       style: "絶界収益錬金術師",             chips: 347000 },
      { rank: 4, name: "サオリ",         style: "最後まで見届ける新進レギュラー", chips: 284500 },
      { rank: 5, name: "たぐちまさき",   style: "安定基盤のスパイククリエイター", chips: 383100 },
      { rank: 6, name: "ぬくみん",       style: "鋼鉄のBB守護神",               chips: 165100 },
      { rank: 7, name: "ペンギンちゃん", style: "不死身の勝負師",               chips: 193700, revive: true },
      { rank: 8, name: "ヤス",           style: "煉獄のオールイン狂",           chips: 108000, revive: true },
      { rank: 9, name: "Shiori",         style: "最後まで見届ける迷える張り師", chips: 48300, revive: true },
    ],
  },
  modes: {
    standby: {                   // 待機画面
      layout: "standby",
      label: "",
      title: "",
      messages: [],
    },
    pre: {                       // オープニング
      layout: "full",
      label: "TODAY",
      title: "FINAL TABLE",
      meta: "9 PLAYERS · 1 CHAMPION",
      messages: [
        "上半期チャンピオンを決める最終決戦、<em>本日開幕</em>",
        "半年間のランキング上位 <em>9名</em> による FINAL TABLE",
        "賞品総額 <em>170万円</em>相当 ── 豪華協賛賞品をかけた最終決戦",
        "総チップ <em>1,863,300</em> 点 ── 最後にすべてを積み上げるのは誰だ",
        "開始ブラインド <em>500 / 1,000</em>　1レベル20分",
      ],
    },
    live: {                      // 対戦中
      layout: "compact",
      label: "",                 // LIVE はハンドOLの左上に出ているので出さない
      title: "FINAL TABLE",
      messages: [
        "<em>9 PLAYERS. 1 TABLE. 1 CHAMPION.</em>",
        "2026年上半期 ファイナルテーブル <em>開催中</em>",
        "賞品総額 <em>170万円</em>相当の最終決戦",
        "最後にチップを積み上げているのは、<em>誰だ。</em>",
      ],
    },
    champion: {                  // 対戦で優勝が決まった瞬間
      layout: "compact",
      label: "WINNER",
      title: "CHAMPION",
      confetti: true,
      messages: [
        "優勝　<em>{name}</em>　おめでとうございます!!",
        "2026年上半期 チャンピオン <em>決定</em>",
      ],
    },
    interview: {                 // ヒーローインタビュー
      layout: "full",
      label: "CHAMPION",
      title: "CHAMPION",
      meta: "{name}",
      confetti: true,
      messages: [
        "2026年上半期 チャンピオン　<em>{name}</em>",
        "<em>ヒーローインタビュー</em>",
        "第2代 KADOSHUN POKER CLUB チャンピオン誕生!!",
      ],
    },
  },
  // スポンサー表「26年上半期」シートの企業名（2026-10-09 時点）。英数字は半角にそろえた
  sponsors: [
    ["オフ・ザ・レコード", "様"],
    ["株式会社NATURE", "様"],
    ["株式会社BeBe16", "様"],
    ["株式会社ハースコーポレーション", "様"],
    ["クスノキノ株式会社", "様"],
    ["Victoriafruit株式会社", "様"],
    ["株式会社ユービリゾート", "様"],
    ["フリート合同会社", "様"],
    ["NextDeal合同会社", ""],
  ],
};
// ======================================================================

const params = new URLSearchParams(location.search);
let mode = CONFIG.modes[params.get("mode")] ? params.get("mode") : "pre";
let champName = params.get("name") || "";
const body = document.body;
if (params.get("bg") === "1") body.classList.add("preview");
if (params.get("sponsor") === "0") body.classList.add("no-sponsor");
if (params.get("scene") === "chips") body.classList.add("scene-chips");
const sparksOn = params.get("sparks") !== "0";
const intro = params.get("intro") !== "0";
if (!intro) body.classList.add("no-anim");

const stage = document.getElementById("stage");
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080, 1);
  stage.style.transform = s < 1 ? `scale(${s})` : "";
}
addEventListener("resize", fit);
fit();

const $ = id => document.getElementById(id);
const safeName = () => champName.replace(/[<>&]/g, "");
const layoutOf = () => CONFIG.modes[mode].layout;

// ---------- 見出し・ラベル ----------
function applyState() {
  const m = CONFIG.modes[mode];
  body.classList.toggle("L-full", m.layout === "full");
  body.classList.toggle("L-compact", m.layout === "compact");
  body.classList.toggle("L-standby", m.layout === "standby");
  if (m.layout === "full") {
    $("f-title").textContent = m.title;
    const meta = (m.meta || "").replace("{name}", safeName());
    const isName = m.meta === "{name}";
    $("f-meta").textContent = isName ? (safeName() || "2026 1ST HALF") : meta;
    $("f-meta").classList.toggle("champ-name", isName && !!safeName());
    const lab = $("f-state").querySelector(".label");
    lab.textContent = m.label;
    lab.classList.remove("flip"); void lab.offsetWidth; lab.classList.add("flip");
  } else {
    $("c-title").textContent = m.title;
    const st = $("c-state");
    st.hidden = !m.label;
    st.textContent = m.label;
    st.classList.remove("flip"); void st.offsetWidth; st.classList.add("flip");
  }
}

// ---------- メッセージ ----------
let idx = 0, msgTimer = null;
const current = { full: null, compact: null };
function messages() {
  return CONFIG.modes[mode].messages
    .filter(t => champName || !t.includes("{name}"))
    .map(t => t.replace(/\{name\}/g, safeName()));
}
function clearMsg(which) {
  const old = current[which];
  if (!old) return;
  old.classList.remove("in"); old.classList.add("out");
  old.addEventListener("animationend", () => old.remove(), { once: true });
  current[which] = null;
}
function showMsg(html) {
  const which = layoutOf();
  clearMsg(which);
  clearMsg(which === "full" ? "compact" : "full");
  const box = $(which === "full" ? "f-msgbox" : "c-msgbox");
  const el = document.createElement("div");
  el.className = "msg";
  el.innerHTML = html;
  box.appendChild(el);
  const room = which === "full" ? box.clientWidth - 76 - 60 : box.clientWidth - 20;
  el.style.setProperty("--sx", Math.min(1, room / el.scrollWidth).toFixed(3));
  el.classList.add("in");
  current[which] = el;
}
function nextMsg() {
  const list = messages();
  if (!list.length) return;
  showMsg(list[idx % list.length]);
  idx++;
  clearTimeout(msgTimer);
  document.querySelectorAll(".progress i").forEach(b => { b.style.transition = "none"; b.style.width = "0"; });
  if (list.length > 1) {
    const bar = document.querySelector(layoutOf() === "full" ? "#f-lower .progress i" : "#c-msgbox .progress i");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = `width ${CONFIG.holdMs}ms linear`;
      bar.style.width = "100%";
    }));
    msgTimer = setTimeout(nextMsg, CONFIG.holdMs);
  }
}

// ---------- スポンサー（両方の帯で同時に回す） ----------
let spIdx = 0;
const spCur = new Map();
function nextSponsor() {
  const [name, suffix] = CONFIG.sponsors[spIdx % CONFIG.sponsors.length];
  spIdx++;
  document.querySelectorAll("#f-sponsor .name-wrap, #c-sponsor .name-wrap").forEach(wrap => {
    const old = spCur.get(wrap);
    if (old) {
      old.classList.remove("in"); old.classList.add("out");
      old.addEventListener("animationend", () => old.remove(), { once: true });
    }
    const el = document.createElement("div");
    el.className = "name goldtxt";
    el.textContent = name;
    if (suffix) { const s = document.createElement("small"); s.textContent = suffix; el.appendChild(s); }
    wrap.appendChild(el);
    el.style.setProperty("--sx", Math.min(1, wrap.clientWidth / el.scrollWidth).toFixed(3));
    el.classList.add("in");
    spCur.set(wrap, el);
  });
}

// ---------- 切り替え ----------
function setMode(m) {
  if (!CONFIG.modes[m]) return;
  const changedLayout = CONFIG.modes[m].layout !== layoutOf();
  mode = m; idx = 0;
  applyState();
  // レイアウトが変わるときは入れ替わりを待ってからメッセージを出す
  clearTimeout(msgTimer);
  setTimeout(nextMsg, changedLayout && intro ? 700 : 0);
  if (CONFIG.modes[m].confetti) celebrate();
}
function setScene(chips) { body.classList.toggle("scene-chips", chips); }
addEventListener("keydown", e => {
  if (e.key === "0") setMode("standby");
  if (e.key === "1") setMode("pre");
  if (e.key === "2") setMode("live");
  if (e.key === "3") setMode("champion");
  if (e.key === "4") setMode("interview");
  if (e.key === "c" || e.key === "C") setScene(!body.classList.contains("scene-chips"));
  if (e.key === "ArrowRight" || e.key === " ") nextMsg();
});
// ---------- 外からの指示（コントロール画面） ----------
// d = { mode, name, sponsor, chips, act }  act: "mode"（場面ボタン）/ "next"（次のメッセージ）/ その他（設定の変更）
function handleCmd(d) {
  if (!d || typeof d !== "object") return;
  if (d.act === "next") { nextMsg(); return; }
  if (typeof d.sponsor === "boolean") body.classList.toggle("no-sponsor", !d.sponsor);
  if (typeof d.chips === "boolean") setScene(d.chips);
  const nameChanged = typeof d.name === "string" && d.name !== champName;
  if (typeof d.name === "string") champName = d.name;
  if (d.mode && CONFIG.modes[d.mode] && (d.act === "mode" || d.mode !== mode)) {
    setMode(d.mode);                       // 場面ボタンは同じ場面でも出し直す（紙吹雪など）
  } else if (nameChanged) {
    applyState(); idx = 0; nextMsg();      // 優勝者名だけ変わったとき
  }
}
// 同じページ内のプレビュー（コントロール画面の iframe）から
addEventListener("message", e => {
  const d = e.data || {};
  if (d.type === "ft-band") handleCmd(d);
});

// 中継サービス（ntfy.sh）から。URL に key=合言葉 があるときだけつなぐ。
//   合言葉はプログラムに書かず URL にだけ持たせる（知っている人だけが操作できる）
const KEY = (params.get("key") || "").toLowerCase().replace(/[^a-z0-9_]/g, "");   // コントロール画面と同じ正規化
const RELAY = "https://ntfy.sh/";
const topic = KEY ? "kadoshun-ft-" + KEY : "";
function parseRelay(raw) {
  try { const m = JSON.parse(raw); return m.event === "message" ? JSON.parse(m.message) : null; } catch (e) { return null; }
}
// 読み込み時：最後に送られた設定を取ってから表示を始める（OBS を再起動しても同じ場面に戻る）
async function restoreFromRelay() {
  if (!topic) return;
  try {
    const res = await fetch(`${RELAY}${topic}/json?poll=1&since=all`);
    const lines = (await res.text()).trim().split("\n").filter(Boolean);
    for (let i = lines.length - 1; i >= 0; i--) {
      const d = parseRelay(lines[i]);
      if (d && d.act !== "next") {
        if (CONFIG.modes[d.mode]) mode = d.mode;
        if (typeof d.name === "string") champName = d.name;
        if (typeof d.sponsor === "boolean") body.classList.toggle("no-sponsor", !d.sponsor);
        if (typeof d.chips === "boolean") setScene(d.chips);
        break;
      }
    }
  } catch (e) { /* つながらなくても URL の設定で表示する */ }
}
function listenRelay() {
  if (!topic) return;
  const es = new EventSource(`${RELAY}${topic}/sse`);
  es.onmessage = ev => handleCmd(parseRelay(ev.data));
  // 切れたら EventSource が自動で再接続する
}

function start() {
  const d = intro ? 1 : 0;
  // 少し置いてからクラスを付けると、読み込み時にも入場アニメが走る
  // （requestAnimationFrame は埋め込み表示で止まることがあるので setTimeout）
  setTimeout(applyState, 60);
  setTimeout(nextMsg, 1300 * d);
  setTimeout(() => { nextSponsor(); setInterval(nextSponsor, CONFIG.sponsorMs); }, 1600 * d);
  if (CONFIG.modes[mode].confetti) setTimeout(celebrate, 1200 * d);
}
Promise.all([
  document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(),
  restoreFromRelay(),
]).then(() => { start(); listenRelay(); });

// ---------- 光の粒・紙吹雪 ----------
// ---------- 待機画面 ----------
const SB = CONFIG.standby;
// start= は日本時間として読む（タイムゾーン指定があればそれに従う）
const startParam = params.get("start");
const startAt = new Date(startParam ? (/(Z|[+-]\d\d:?\d\d)$/i.test(startParam) ? startParam : startParam + "+09:00") : SB.start);
const WD = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
const escHtml = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
(function buildStandby() {
  if (!isNaN(startAt)) {
    const j = new Date(startAt.getTime() + 9 * 3600e3);   // 表示は日本時間
    const pad = n => String(n).padStart(2, "0");
    $("sb-when").innerHTML = `配信開始　<b class="en">${j.getUTCFullYear()}.${pad(j.getUTCMonth() + 1)}.${pad(j.getUTCDate())} ${WD[j.getUTCDay()]}　${pad(j.getUTCHours())}:${pad(j.getUTCMinutes())}</b>`;
  }
  $("sb-info").innerHTML = SB.info;
  // 小さなスートを横いっぱいに散らす（位置・大きさ・速さ・揺れはばらばらに）
  const SUITS = ["♠", "♥", "♦", "♣"];
  $("sb-floats").innerHTML = Array.from({ length: 14 }, (_, i) => {
    const suit = SUITS[i % 4];
    const left = Math.round(40 + (1840 / 14) * i + Math.random() * 60);
    const size = Math.round(36 + Math.random() * 54);
    const dur = (22 + Math.random() * 16).toFixed(1);
    const delay = (-Math.random() * 38).toFixed(1);
    const sway = Math.round((Math.random() - .5) * 140);
    const red = suit === "♥" || suit === "♦" ? " r" : "";
    return `<span class="sb-float${red}" style="left:${left}px; font-size:${size}px; --dur:${dur}s; --delay:${delay}s; --sway:${sway}px">${suit}</span>`;
  }).join("");
  $("sb-prize-v").innerHTML = SB.prize;
  $("sb-prize").hidden = !SB.prize;
  $("sb-show").innerHTML = SB.players.map(p => `
    <div class="sb-slide">
      <div class="sb-rank"><div class="l en">RANK</div><div class="n en goldtxt">${p.rank}</div></div>
      <div class="sb-div"></div>
      <div class="sb-pinfo">
        ${p.revive ? '<div class="rv">敗者復活</div>' : ""}
        <div class="nm">${escHtml(p.name)}</div>
        <div class="st goldtxt">「${escHtml(p.style)}」</div>
        <div class="ch">持ち込みチップ<b>${p.chips.toLocaleString("en-US")}</b>pt</div>
      </div>
    </div>`).join("");
  $("sb-dots").innerHTML = SB.players.map(p => `<span>${p.rank}</span>`).join("");
  const names = CONFIG.sponsors.map(([n, suf]) => `<span>${escHtml(n)}${suf ? " " + suf : ""}</span><i>◆</i>`).join("");
  const track = $("sb-track");
  track.innerHTML = names + names;            // 2周分並べて -50% 動かすと途切れない
  track.style.setProperty("--dur", Math.max(30, CONFIG.sponsors.length * 7) + "s");
})();
function tickCountdown() {
  const el = $("sb-count");
  const left = Math.floor((startAt - Date.now()) / 1000);
  if (isNaN(left) || left <= 0) {
    el.textContent = "まもなく開始します";
    el.classList.add("done");
    return;
  }
  const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), sec = left % 60;
  el.textContent = [h, m, sec].map(n => String(n).padStart(2, "0")).join(":");
  el.classList.remove("done");
}
tickCountdown();
setInterval(tickCountdown, 1000);
// ファイナリストを1人ずつフェードで入れ替える（ランキング順）
let showIdx = -1;
function nextPlayer() {
  const slides = document.querySelectorAll(".sb-slide");
  const dots = document.querySelectorAll(".sb-dots span");
  if (!slides.length) return;
  const prev = slides[showIdx];
  if (prev) { prev.classList.remove("on"); prev.classList.add("off"); setTimeout(() => prev.classList.remove("off"), 900); }
  showIdx = (showIdx + 1) % slides.length;
  slides[showIdx].classList.add("on");
  dots.forEach((d, i) => d.classList.toggle("on", i === showIdx));
}
nextPlayer();
setInterval(nextPlayer, SB.rotateMs || 4500);

const cv = $("fx");
const ctx = cv.getContext("2d");
const P = [];
function sparkZones() {
  if (layoutOf() === "standby") {
    return [{ x0: 0, x1: 1920, y: 1060, dir: -1, w: 1, slow: true }];
  }
  if (layoutOf() === "full") {
    return [
      { x0: 0, x1: 760, y: 176, dir: 1, w: 1 },
      { x0: 1460, x1: 1920, y: 176, dir: 1, w: 1 },
      { x0: 0, x1: 1920, y: 936, dir: -1, w: 2.4 },
    ];
  }
  const chips = body.classList.contains("scene-chips");
  const z = [{ x0: 620, x1: 1300, y: chips ? 74 : 126, dir: 1, w: 2 }];
  if (!chips && !body.classList.contains("no-sponsor")) z.push({ x0: 1400, x1: 1880, y: 966, dir: -1, w: 1 });
  return z;
}
function spark() {
  const zs = sparkZones();
  const total = zs.reduce((a, z) => a + z.w, 0);
  let r = Math.random() * total, z = zs[0];
  for (const c of zs) { if ((r -= c.w) <= 0) { z = c; break; } }
  const full = layoutOf() === "full";
  P.push({
    t: "s",
    x: z.x0 + Math.random() * (z.x1 - z.x0),
    y: z.y,
    vx: (Math.random() - .5) * .4,
    vy: z.dir * (z.slow ? .5 + Math.random() * 1.1 : (full ? .25 : .2) + Math.random() * (full ? .7 : .5)),
    r: .8 + Math.random() * (z.slow ? 2.2 : 1.6),
    life: 0, max: z.slow ? 260 + Math.random() * 380 : (full ? 70 : 50) + Math.random() * (full ? 90 : 60),
  });
}
function celebrate() {
  const flash = $("champ-flash");
  const full = layoutOf() === "full";
  flash.style.setProperty("--fy", full ? "100%" : "0%");
  flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
  for (let i = 0; i < 300; i++) {
    const left = i % 2 === 0;
    P.push(full ? {
      // 全幅：画面の下の左右から打ち上げる
      t: "c", x: left ? -10 : 1930, y: 900 + Math.random() * 60,
      vx: (left ? 1 : -1) * (6 + Math.random() * 12), vy: -(10 + Math.random() * 14), g: .32, vmax: 5,
      w: 7 + Math.random() * 9, h: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
      hue: Math.random() < .82 ? 44 : 350, life: 0, max: 420,
    } : {
      // コンパクト：クレストの両脇から降らせる
      t: "c", x: left ? 600 : 1320, y: 60,
      vx: (left ? -1 : 1) * (2 + Math.random() * 9), vy: -(2 + Math.random() * 7), g: .16, vmax: 3.2,
      w: 7 + Math.random() * 9, h: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
      hue: Math.random() < .82 ? 44 : 350, life: 0, max: 380,
    });
  }
}
function frame() {
  ctx.clearRect(0, 0, 1920, 1080);
  const cap = layoutOf() === "standby" ? 160 : layoutOf() === "full" ? 120 : 60;
  if (sparksOn && P.length < cap && Math.random() < .45) spark();
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.life++;
    if (p.t === "s") {
      p.x += p.vx; p.y += p.vy;
      const k = p.life / p.max;
      const a = (k < .2 ? k / .2 : 1 - (k - .2) / .8) * (.5 + Math.random() * .5);
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,224,150,${a})`;
      ctx.shadowColor = "rgba(255,200,90,.9)";
      ctx.shadowBlur = 8;
      ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.fill();
    } else {
      p.vy += p.g; p.vx *= .985; p.vy = Math.min(p.vy, p.vmax);
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.shadowBlur = 0;
      ctx.fillStyle = `hsl(${p.hue}, 90%, ${50 + 30 * Math.abs(Math.cos(p.rot * 2))}%)`;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot)));
      ctx.restore();
    }
    if (p.life > p.max || p.y > 1100) P.splice(i, 1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
